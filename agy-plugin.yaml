# agy-plugin.yaml
# z-harness agy export manifest — read by runtime/drivers/antigravity/export.py
# NOT a native Antigravity file format (agy does not read this)
schema_version: 1

metadata:
  name: z-harness
  description: z-harness planning and implementation workflow for Antigravity IDE
  source_repo: https://github.com/zeke-tools/z-harness

# Commands → .agent/workflows/*.md
# Each command becomes a custom chat mode (agy chat --mode <id>)
workflows:
  - id: z-amend
    source: commands/z-amend.md
    output: .agent/workflows/z-amend.md
    description: "Amend an existing z-harness plan (SPEC/PLAN/TASKS) or light-plan (FIX.md) so a change is propagated consistently across all artifacts. Preserves completed task state; adds/modifies/removes tasks as needed; optionally cross-consults if the amendmen..."
  - id: z-attend
    source: commands/z-attend.md
    output: .agent/workflows/z-attend.md
    description: "Run a z-harness command chain in attended middle-gear mode: auto-advance the plan/audit/test/implement/review chain, halt and ask inline only on the four-category gate taxonomy, and yield for a user /clear at context boundaries."
  - id: z-audit-plan-style
    source: commands/z-audit-plan-style.md
    output: .agent/workflows/z-audit-plan-style.md
    description: "Audit a plan's artifacts (SPEC.md, PLAN.md, TASKS.md) for the same kind of code-quality issues /z-mr-review finds on a diff — defensive bloat, premature abstraction, DRY/KISS/SOLID violations, over-engineering, STYLE.md drift — BEFORE any code is ..."
  - id: z-audit-plan
    source: commands/z-audit-plan.md
    output: .agent/workflows/z-audit-plan.md
    description: "Audit a plan's artifacts (SPEC.md, PLAN.md, TASKS.md) before execution. Reality-checks references against the codebase, verifies best practices/design, and runs a cross-LLM adversarial review. Emits PLAN_AUDIT_REPORT.md."
  - id: z-audit
    source: commands/z-audit.md
    output: .agent/workflows/z-audit.md
    description: "Audit a target component across one or more dimensions (correctness / perf / cleanliness / design). Pre-flight scopes (target, dimensions, optional rubric file), spawns one auditor subagent per dimension in parallel, runs bundled Gemini+Codex cons..."
  - id: z-axiom-approve
    source: commands/z-axiom-approve.md
    output: .agent/workflows/z-axiom-approve.md
    description: "Approve a candidate axiom. Shows the candidate, its evidence, and falsifiability state. Requires explicit user confirmation before approving. Reuses /z-suggest-memory --from-candidate-json for the MEMORY-overlap advisory. Regenerates the kernel sy..."
  - id: z-axiom-edit
    source: commands/z-axiom-edit.md
    output: .agent/workflows/z-axiom-edit.md
    description: "Edit a field on a candidate or approved axiom record. On approved records, re-validates the graph and regenerates the kernel."
  - id: z-axiom-list
    source: commands/z-axiom-list.md
    output: .agent/workflows/z-axiom-list.md
    description: "List axiom records from the store, rendered as a readable table. Supports filtering by status, scope, and discipline."
  - id: z-axiom-reject
    source: commands/z-axiom-reject.md
    output: .agent/workflows/z-axiom-reject.md
    description: "Reject a candidate or approved axiom, moving it to the rejected/ tombstone store. Optionally records a rejection reason."
  - id: z-axiom-scan
    source: commands/z-axiom-scan.md
    output: .agent/workflows/z-axiom-scan.md
    description: "Mine candidate axioms from z-harness interaction history by dispatching the axiom-extractor agent, then writing returned candidates to the axiom store. Use --historical for a full metrics.jsonl scan (expensive). Proposes only — never auto-approves."
  - id: z-brainstorm
    source: commands/z-brainstorm.md
    output: .agent/workflows/z-brainstorm.md
    description: "Cheap parallel pre-plan ideation — dispatch 3 vendor-diverse ideators (Claude + Codex + Gemini), perform a mandatory anti-bias check, and produce BRAINSTORM.md to seed /z-plan."
  - id: z-context-budget
    source: commands/z-context-budget.md
    output: .agent/workflows/z-context-budget.md
    description: "Analyze context utilization from z-harness telemetry and surface actionable savings recommendations."
  - id: z-debug
    source: commands/z-debug.md
    output: .agent/workflows/z-debug.md
    description: "Heavy hypothesis-tournament debugging pipeline for the case where root cause is unknown. Two rounds of adversarial multi-LLM hypothesis generation (Claude + Codex + Gemini), discriminating-test matrix with consensus-first ranking + forced outlier ..."
  - id: z-do
    source: commands/z-do.md
    output: .agent/workflows/z-do.md
    description: "Plan-less z-harness execution for small tasks. Brings the harness discipline — premise check, doc-fetcher grounding, codex review safety gate, structured logging — without SPEC/PLAN/TASKS/FIX.md ceremony. Logs to z-harness/adhoc/ so /z-improve can..."
  - id: z-doc-rationale
    source: commands/z-doc-rationale.md
    output: .agent/workflows/z-doc-rationale.md
    description: "Tier 2 narrative doc command. Reads tier2-context.json and produces ADRs, design rationale, tradeoff explanations, and migration guides from warm pipeline context."
  - id: z-evaluate
    source: commands/z-evaluate.md
    output: .agent/workflows/z-evaluate.md
    description: "Evaluate a completed z-harness session for patterns worth preserving as memories or skills."
  - id: z-explain
    source: commands/z-explain.md
    output: .agent/workflows/z-explain.md
    description: "One-shot structured explanation of code at a chosen depth lens. Replaces ad-hoc \"explain at high level / more detail\" prompts. Citations required. Handoff to /z-learn when interactive exploration is warranted. Read-only, no cross-LLM consult."
  - id: z-export
    source: commands/z-export.md
    output: .agent/workflows/z-export.md
    description: "Export z-harness commands/agents/skills/personas to Cursor / Codex / Antigravity (agy) / pi."
  - id: z-fix
    source: commands/z-fix.md
    output: .agent/workflows/z-fix.md
    description: "Lightweight bug-fix command for the case where the user already has a diagnosis. Captures problem + repro, single light-fix sanity consult (\"does the proposed cause explain all symptoms?\"), inline implementation, non-negotiable Codex review. Optio..."
  - id: z-followup-confirm
    source: commands/z-followup-confirm.md
    output: .agent/workflows/z-followup-confirm.md
    description: "Transition a follow-up entry from verify → done via human confirmation or audit evidence validation."
  - id: z-followup-dismiss
    source: commands/z-followup-dismiss.md
    output: .agent/workflows/z-followup-dismiss.md
    description: "Dismiss a follow-up entry from any state (terminal transition). Requires a reason."
  - id: z-followup-list
    source: commands/z-followup-list.md
    output: .agent/workflows/z-followup-list.md
    description: "Read-only listing of follow-up entries from project and global sinks, priority-sorted and filterable."
  - id: z-followup-next
    source: commands/z-followup-next.md
    output: .agent/workflows/z-followup-next.md
    description: "Claim and execute the next pending follow-up entry from the project or global sink, with staleness check, lock management, and status writeback."
  - id: z-followup-refresh
    source: commands/z-followup-refresh.md
    output: .agent/workflows/z-followup-refresh.md
    description: "Refresh a blocked (staleness) follow-up entry — re-stamps capture_head and file_blob_hashes, then transitions back to open."
  - id: z-followup-status
    source: commands/z-followup-status.md
    output: .agent/workflows/z-followup-status.md
    description: "Read-only diagnostic summary of the follow-up sink — counts per status, lock state, oldest open entry, and last sync failure."
  - id: z-git-guardrails
    source: commands/z-git-guardrails.md
    output: .agent/workflows/z-git-guardrails.md
    description: "Install, remove, or report status of the z-harness PreToolUse guardrail hooks (git-safety + worktree-isolation) in global or project Claude Code settings."
  - id: z-grill
    source: commands/z-grill.md
    output: .agent/workflows/z-grill.md
    description: "Live depth-first interrogation that sharpens a vague idea into a buildable problem statement. Asks ONE question at a time, always states a recommended answer, self-serves codebase-answerable questions via Explore, and terminates adaptively. Writes..."
  - id: z-handoff
    source: commands/z-handoff.md
    output: .agent/workflows/z-handoff.md
    description: "Write a handoff.json artifact for session continuity. Captures the current working context (plan slug, active files, next step) into a machine-readable JSON contract that any orchestrator (Hermes) can consume to resume work in a fresh agent sessio..."
  - id: z-implement-all
    source: commands/z-implement-all.md
    output: .agent/workflows/z-implement-all.md
    description: "Orchestrate implementation of ALL pending tasks in z-harness/TASKS.md, spawning a fresh implementer subagent per task and a reviewer per task. Halts on blockers, retries once on review failure, push-notifies user on every gate."
  - id: z-implement-next
    source: commands/z-implement-next.md
    output: .agent/workflows/z-implement-next.md
    description: "Implement the next pending task from z-harness/TASKS.md, then have Codex scrutinize the diff."
  - id: z-improve
    source: commands/z-improve.md
    output: .agent/workflows/z-improve.md
    description: "Post-run retrospective. Analyzes ONE z-harness run's events.jsonl + artifacts, identifies friction signals (slow phases, retries, doc drift, blocked askings, reviewer cycles), and opens a discussion with the user about concrete edits to the z-harn..."
  - id: z-init-docs
    source: commands/z-init-docs.md
    output: .agent/workflows/z-init-docs.md
    description: "Bootstrap a two-tier docs system in the current repo — docs/human/ (Markdown for humans) and docs/llm/ (token-compacted JSON for fast-lookup by future /z-plan runs). Idempotent; re-runnable to extend coverage."
  - id: z-learn
    source: commands/z-learn.md
    output: .agent/workflows/z-learn.md
    description: "Interactive progressive-disclosure tutor for understanding code. Replaces repetitive \"explain more / tell me about X\" sessions. Four depth lenses, resumable staging, optional LEARN.md artifact. Read-only, no cross-LLM consult."
  - id: z-maintain-docs
    source: commands/z-maintain-docs.md
    output: .agent/workflows/z-maintain-docs.md
    description: "Refresh stale docs in docs/human/ and docs/llm/. Reads docs/llm/INDEX.json to find concepts whose source files changed since each doc's last_updated. Spawns doc-updater subagents (Sonnet) per stale concept. Applies refreshed docs by default; pass ..."
  - id: z-map
    source: commands/z-map.md
    output: .agent/workflows/z-map.md
    description: "Maps terrain with citations + cross-LLM critique. No recommendations — terrain only. See `/z-research` for synthesis across map + brainstorm."
  - id: z-mr-review
    source: commands/z-mr-review.md
    output: .agent/workflows/z-mr-review.md
    description: "Multi-LLM code-quality review of the current branch diff against STYLE.md. Never blocks; ranks P0-P4; output is a TASKS.md-shape file you edit and feed to /z-implement-all."
  - id: z-overnight
    source: commands/z-overnight.md
    output: .agent/workflows/z-overnight.md
    description: "Run a chain of z-harness workflows unattended overnight with halt-only user interaction. Chains existing sub-commands end-to-end, writes MORNING_REPORT.md, and push-notifies on halt or completion."
  - id: z-personas
    source: commands/z-personas.md
    output: .agent/workflows/z-personas.md
    description: "Inspect persona registry, role bindings, and persona files. Subcommands: list, roles, validate, read <name>, where <name>. Default (no args) = roles."
  - id: z-plan-light
    source: commands/z-plan-light.md
    output: .agent/workflows/z-plan-light.md
    description: "Lightweight planner for small targeted changes / bug fixes. Bundled cross-LLM consult, single FIX.md artifact, inline implementation in the orchestrator (no implementer subagent), codex review still runs as the safety gate. Routes down, up, sidewa..."
  - id: z-plan-split
    source: commands/z-plan-split.md
    output: .agent/workflows/z-plan-split.md
    description: "Pre-emptive scope splitter — fan a big topic out into N narrow cluster-planner subagents in parallel, then reconcile file-path overlaps into SHARED-CONCERNS.md + MANIFEST.md."
  - id: z-plan
    source: commands/z-plan.md
    output: .agent/workflows/z-plan.md
    description: "Run the rigorous z-harness planning pipeline — challenge premises, batch decisions, cross-consult Gemini + Codex once, and produce SPEC.md / PLAN.md / TASKS.md."
  - id: z-providers-discover
    source: commands/z-providers-discover.md
    output: .agent/workflows/z-providers-discover.md
    description: Discover LLM CLI providers in PATH and generate providers.json.
  - id: z-reality
    source: commands/z-reality.md
    output: .agent/workflows/z-reality.md
    description: "Interactive premise refinement — conversational on-ramp. Probes, clarifies,"
  - id: z-research
    source: commands/z-research.md
    output: .agent/workflows/z-research.md
    description: "Higher-order meta-orchestrator. Composes /z-map (terrain) and /z-brainstorm (framings), then runs adversarial synthesis panel (3 perspectives + judge) producing RESEARCH.md with 10-section schema including approach decision matrix. Cost 3–6M token..."
  - id: z-review-all
    source: commands/z-review-all.md
    output: .agent/workflows/z-review-all.md
    description: "Final-gate cross-LLM review of a completed z-harness plan. Runs Gemini + Codex on the cumulative diff against SPEC.md to surface (a) implementation drift across tasks and (b) spec gaps that only surface in aggregate. Use after /z-implement-all com..."
  - id: z-setup
    source: commands/z-setup.md
    output: .agent/workflows/z-setup.md
    description: "Configuration cockpit for z-harness: inspect resolved state, run guided setup wizard, or apply a posture preset."
  - id: z-skill-fix
    source: commands/z-skill-fix.md
    output: .agent/workflows/z-skill-fix.md
    description: "Diagnose and patch a misleading skill file — any SKILL.md under .claude/skills/ in the current repo, or any z-harness commands/*.md / agents/*.md when invoked inside the z-harness repo itself. Inline diagnosis note, surgical edit, reviewer safety ..."
  - id: z-stats
    source: commands/z-stats.md
    output: .agent/workflows/z-stats.md
    description: "Read-only progress + cost report for a z-harness plan. Reads metrics.jsonl + TASKS.md to summarize progress, wall time per phase, estimated token spend per subagent type, recent halts, and suggested next command. No writes, no LLM calls."
  - id: z-style-init
    source: commands/z-style-init.md
    output: .agent/workflows/z-style-init.md
    description: "Author the project STYLE.md interactively, grounded in the repo's most idiomatic existing files (Capture). Required before /z-mr-review will run."
  - id: z-suggest-memory
    source: commands/z-suggest-memory.md
    output: .agent/workflows/z-suggest-memory.md
    description: "Authoring skill for the docs/llm/ memory layer. Called mandatorily from /z-debug post-mortem and /z-improve retro. Validates input against the memory schema, writes to docs/llm/<slug>.json, regenerates docs/llm/MEMORIES-FLAT.md, optionally extract..."
  - id: z-test
    source: commands/z-test.md
    output: .agent/workflows/z-test.md
    description: "System-level invariant test planner. Reads INVARIANTS.json + SPEC.md + PLAN.md + TASKS.md, matches invariants to tasks via tag-based mapping, drafts behavioral tests keyed to durable system invariants, cross-LLM consult with invariant coverage ana..."
  - id: z-update
    source: commands/z-update.md
    output: .agent/workflows/z-update.md
    description: "Update the z-harness plugin to the latest version. Detects symlink vs tarball install mode and runs the appropriate update path."
  - id: z-uplift
    source: commands/z-uplift.md
    output: .agent/workflows/z-uplift.md
    description: "Tiered bulk codebase quality uplift — decompose repo into components, run a repo-wide cross-cutting pass, dispatch per-component audits, produce per-component TASKS.md files, and drive sequential implementation via /z-implement-all."
  - id: z-verify
    source: commands/z-verify.md
    output: .agent/workflows/z-verify.md
    description: "Interactive understanding — reconstruct what a codebase feature actually does,"
  - id: z-where
    source: commands/z-where.md
    output: .agent/workflows/z-where.md
    description: "Read-only \"what's active / why am I blocked\" query. Prints resolved base + repo-id, lists all active plans (slug, command, phase, branch, current_task, age, status), and optionally shows path-overlap with the current run. No writes, no LLM calls."

# Agents → .agent/rules/*.md
# No subagent dispatch in agy; agents become role-specific rule files
rules:
  - id: auditor
    source: agents/auditor.md
    output: .agent/rules/z-harness-auditor.md
    trigger: always_on
    description: "Fresh-context Sonnet auditor for a single dimension (correctness | perf | cleanliness | design). Reads target files + optional rubric file, returns structured findings (Location / Evidence / Recommendation / Severity). Read-only — never edits. Spa..."
  - id: axiom-extractor
    source: agents/axiom-extractor.md
    output: .agent/rules/z-harness-axiom-extractor.md
    trigger: model_decision
    description: "Retrospective policy-mining agent. Wraps axiom-extract.py with LLM judgement to produce ≤5 sharpened axiom candidates from z-harness interaction history. Sibling to the reviewer agent — NOT an extension of any candidate_kind enum. Proposes only; n..."
  - id: bisect-isolator
    source: agents/bisect-isolator.md
    output: .agent/rules/z-harness-bisect-isolator.md
    trigger: model_decision
    description: "Haiku subagent that drives `git bisect run` between a known-good ref and HEAD using a caller-supplied repro script, then returns the offending commit SHA + line-level diff. Mechanical only — no interpretation of WHY the change broke things. Trigge..."
  - id: cluster-planner
    source: agents/cluster-planner.md
    output: .agent/rules/z-harness-cluster-planner.md
    trigger: model_decision
    description: "A `model: sonnet` subagent that runs a stripped-down `/z-plan`-equivalent for ONE narrow scope (one cluster) within a `/z-plan-split` run. Produces SPEC.md + PLAN.md + TASKS.md for the cluster, resolves small decisions unilaterally, and escalates ..."
  - id: complexity-classifier
    source: agents/complexity-classifier.md
    output: .agent/rules/z-harness-complexity-classifier.md
    trigger: model_decision
    description: "Reads a single task block (plus optional SPEC.md slice) and returns a complexity tier — `low`, `medium`, or `high` — that the orchestrator uses to pick which model to dispatch the implementer at. Cheap Haiku call, one per task, stamped once at pla..."
  - id: consultant-primary
    source: agents/consultant-primary.md
    output: .agent/rules/z-harness-consultant-primary.md
    trigger: model_decision
    description: "Routes to the primary consultant LLM (resolved via providers registry) for a second opinion on an engineering decision or to review a plan. Use during /z-plan when a non-obvious decision needs cross-LLM input, and again to review the final plan."
  - id: consultant-secondary
    source: agents/consultant-secondary.md
    output: .agent/rules/z-harness-consultant-secondary.md
    trigger: model_decision
    description: "Routes to the secondary consultant LLM (resolved via providers registry) for a second opinion on an engineering decision or to review a plan. Use during /z-plan as the cross-LLM counterpart to consultant-primary — must resolve to a distinct provider."
  - id: context-curator
    source: agents/context-curator.md
    output: .agent/rules/z-harness-context-curator.md
    trigger: model_decision
    description: "Haiku subagent that folds the events.jsonl delta + git diff + TASKS.md + prior SESSION.md into a bounded SESSION.md handoff artifact at the /z-implement-all batch breakpoint. Mechanical curation only — never edits production code."
  - id: doc-fetcher
    source: agents/doc-fetcher.md
    output: .agent/rules/z-harness-doc-fetcher.md
    trigger: model_decision
    description: "Fast Haiku context-fetcher for the two-tier docs system (docs/llm/INDEX.json + per-concept LLM JSONs + human-tier markdown). Caller asks \"I need context on X\"; this agent reads INDEX.json, picks the matching concept(s), reads their JSONs (and opti..."
  - id: doc-updater
    source: agents/doc-updater.md
    output: .agent/rules/z-harness-doc-updater.md
    trigger: model_decision
    description: "Sonnet subagent invoked by /z-maintain-docs to refresh ONE doc concept (one human-tier markdown + one llm-tier JSON entry) so they reflect current code. Returns the proposed updates as text (dry-run by default); does NOT write to disk unless expli..."
  - id: external-lookup
    source: agents/external-lookup.md
    output: .agent/rules/z-harness-external-lookup.md
    trigger: model_decision
    description: "Fetch external information (web docs, public APIs, paginated JSON, library docs outside training cutoff) and return a tight STATUS-headed Markdown synthesis per docs/llm/lookup-contract.json. Read-only. Refuses mutating shell commands via verb-blo..."
  - id: implementer
    source: agents/implementer.md
    output: .agent/rules/z-harness-implementer.md
    trigger: always_on
    description: "Implements a single task from $Z_HARNESS_PLAN_DIR/TASKS.md in a fresh context. Invoked by /z-implement-all once per task to keep main orchestrator context lean. Reads only the slice of SPEC.md/PLAN.md it needs, edits files, returns a structured su..."
  - id: mr-reviewer
    source: agents/mr-reviewer.md
    output: .agent/rules/z-harness-mr-reviewer.md
    trigger: always_on
    description: "Multi-LLM code-quality reviewer for branch diffs. Assumes correctness; targets AI-shaped and human-shaped slop. Ranks P0-P4, never blocks, never finds correctness bugs (those belong to reviewer)."
  - id: plan-style-reviewer
    source: agents/plan-style-reviewer.md
    output: .agent/rules/z-harness-plan-style-reviewer.md
    trigger: model_decision
    description: "Multi-LLM code-quality reviewer for plan artifacts (SPEC.md, PLAN.md, TASKS.md). Targets proposed defensive bloat, premature abstraction, DRY/KISS/SOLID violations, over-engineering, and STYLE.md drift BEFORE any code is written. Ranks BLOCKER / M..."
  - id: planning-router
    source: agents/planning-router.md
    output: .agent/rules/z-harness-planning-router.md
    trigger: model_decision
    description: "Cheap Haiku ambiguity resolver for z-harness plan-family route decisions. Reads a compact signal payload and recommends the best command or contextual exit; advisory only."
  - id: pre-reviewer
    source: agents/pre-reviewer.md
    output: .agent/rules/z-harness-pre-reviewer.md
    trigger: model_decision
    description: "Cheap DeepSeek V4 Flash pre-reviewer that runs a fast first-pass scan on a cumulative diff, plan artifacts, or per-task diff. Produces preliminary findings (blockers/majors) that feed into the real reviewers (consultant-primary, consultant-seconda..."
  - id: remote-runner
    source: agents/remote-runner.md
    output: .agent/rules/z-harness-remote-runner.md
    trigger: always_on
    description: "Haiku subagent that handles MECHANICAL remote work — rsync local repo to a per-(slug, task-id) sandbox on the remote host, run cargo build/check/clean, restart paper qtctl manifests, tail logs, run READ-ONLY DB/disk/log queries against shared stat..."
  - id: research-judge
    source: agents/research-judge.md
    output: .agent/rules/z-harness-research-judge.md
    trigger: model_decision
    description: "Final-judge synthesizer for /z-research. Reads N=3 adversarial-panel perspective outputs + the MAP.md + BRAINSTORM.md source artifacts; produces the final RESEARCH.md content (10 sections per SPEC) including the approach decision matrix with manda..."
  - id: resolver
    source: agents/resolver.md
    output: .agent/rules/z-harness-resolver.md
    trigger: model_decision
    description: "Documents the workflow question resolver — the read-only subsystem that maps registered question_ids to a result-domain value (skip|prefill|ask|halt|defer-to-sink) by consulting config layers, memory, and overnight-gate overrides."
  - id: review-agent
    source: agents/review-agent.md
    output: .agent/rules/z-harness-review-agent.md
    trigger: model_decision
    description: "Post-run Haiku subagent that proposes 0-3 candidate memories from a completed /z-implement-all, /z-review-all, or /z-debug run. Reads run events + cumulative diff + SPEC.md (or DEBUG.md for debug runs); emits structured candidates as a single fenc..."
  - id: reviewer
    source: agents/reviewer.md
    output: .agent/rules/z-harness-reviewer.md
    trigger: always_on
    description: "Routes to the reviewer LLM (resolved via providers registry) to scrutinize a just-completed implementation task. Finds bugs, spec violations, missed edge cases, and DRY/KISS/SOLID violations."
  - id: scope-extractor
    source: agents/scope-extractor.md
    output: .agent/rules/z-harness-scope-extractor.md
    trigger: model_decision
    description: "Reads SPEC.md, PLAN.md, and TASKS.md from a plan artifact directory and emits a JSON array of likely file changes with confidence labels. Used by run-creating commands (z-implement-all, z-plan, etc.) to seed the active-plan registry scope before o..."
  - id: scope-probe
    source: agents/scope-probe.md
    output: .agent/rules/z-harness-scope-probe.md
    trigger: model_decision
    description: "Pre-dispatch Haiku scope classifier. Runs as Phase 0 of host z-* commands (initially /z-audit and /z-brainstorm). Classifies the topic as LIGHT / MEDIUM / HEAVY by walking codebase structure and counting natural seams, with a caller-supplied axis ..."
  - id: scope-reconciler-audit
    source: agents/scope-reconciler-audit.md
    output: .agent/rules/z-harness-scope-reconciler-audit.md
    trigger: model_decision
