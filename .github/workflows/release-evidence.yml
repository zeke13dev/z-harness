name: Produce exact release evidence

on:
  workflow_dispatch:
    inputs:
      candidate_version:
        description: Canonical release version
        required: true
        type: string
      candidate_sha:
        description: Exact protected prod tip
        required: true
        type: string

permissions:
  contents: read

jobs:
  bind-authority:
    name: bind authoritative prod before checkout
    runs-on: ubuntu-24.04
    outputs:
      candidate_sha: ${{ steps.bind.outputs.candidate_sha }}
    steps:
      - name: Fetch protected prod without host credentials
        id: bind
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "candidate SHA is not canonical" >&2; exit 1; }
          git init --quiet "$RUNNER_TEMP/authority"
          git -C "$RUNNER_TEMP/authority" remote add origin "$SERVER_URL/$REPOSITORY.git"
          git -C "$RUNNER_TEMP/authority" fetch --quiet --force --no-tags --depth=1 origin \
            "+refs/heads/prod:refs/remotes/origin/prod"
          PROD_TIP="$(git -C "$RUNNER_TEMP/authority" rev-parse --verify 'refs/remotes/origin/prod^{commit}')"
          [[ "$CANDIDATE_SHA" == "$PROD_TIP" ]] || { echo "candidate is not authoritative origin/prod" >&2; exit 1; }
          printf 'candidate_sha=%s\n' "$PROD_TIP" >>"$GITHUB_OUTPUT"

  produce:
    name: execute protected C1 host evidence
    needs: bind-authority
    runs-on: [self-hosted, linux, x64, z-harness-release-evidence]
    environment: release-evidence
    permissions:
      contents: read
    steps:
      - name: Checkout bound candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.bind-authority.outputs.candidate_sha }}
          fetch-depth: 0
      - name: Set up locked Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Set up pinned uv
        uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v6.0.1
        with:
          version: "0.11.3"
          checksum: "c0f3236f146e55472663cfbcc9be3042a9f1092275bbe3fe2a56a6cbfd3da5ce"
          enable-cache: false
      - name: Install reviewed lock
        run: uv sync --frozen --all-extras --all-groups --no-install-project
      - name: Assemble one canonical candidate
        shell: bash
        env:
          CANDIDATE_SHA: ${{ needs.bind-authority.outputs.candidate_sha }}
          CANDIDATE_VERSION: ${{ inputs.candidate_version }}
        run: |
          set -euo pipefail
          python scripts/stage-release-surface.py \
            --repo-root "$GITHUB_WORKSPACE" \
            --out "$RUNNER_TEMP/release-candidate-root" \
            --candidate-version "$CANDIDATE_VERSION" \
            --candidate-commit "$CANDIDATE_SHA"
          python scripts/assemble-release.py \
            --repo-root "$GITHUB_WORKSPACE" \
            --out "$RUNNER_TEMP/release-artifacts" \
            --candidate-version "$CANDIDATE_VERSION" \
            --candidate-commit "$CANDIDATE_SHA" \
            --artifact-base-url "https://github.com/$GITHUB_REPOSITORY/releases/download/v$CANDIDATE_VERSION"
          mkdir -p "$RUNNER_TEMP/release-host-evidence" "$RUNNER_TEMP/host-homes/claude" "$RUNNER_TEMP/host-homes/cli" "$RUNNER_TEMP/host-homes/codex" "$RUNNER_TEMP/host-homes/omp"
          TARBALL="$(find "$RUNNER_TEMP/release-artifacts" -maxdepth 1 -name 'z-harness-*.tar.gz' -print -quit)"
          WHEEL="$(find "$RUNNER_TEMP/release-artifacts" -maxdepth 1 -name '*.whl' -print -quit)"
          for host in claude codex; do
            mkdir -p "$RUNNER_TEMP/host-homes/$host"/{xdg-config,xdg-data,xdg-state,xdg-cache,codex-home,claude-config}
          done
          HOME="$RUNNER_TEMP/host-homes/claude" XDG_CONFIG_HOME="$RUNNER_TEMP/host-homes/claude/xdg-config" XDG_DATA_HOME="$RUNNER_TEMP/host-homes/claude/xdg-data" XDG_STATE_HOME="$RUNNER_TEMP/host-homes/claude/xdg-state" XDG_CACHE_HOME="$RUNNER_TEMP/host-homes/claude/xdg-cache" CODEX_HOME="$RUNNER_TEMP/host-homes/claude/codex-home" CLAUDE_CONFIG_DIR="$RUNNER_TEMP/host-homes/claude/claude-config" bash "$RUNNER_TEMP/release-artifacts/install-plugin.sh" --target=claude --tarball="$TARBALL" --force
          HOME="$RUNNER_TEMP/host-homes/codex" XDG_CONFIG_HOME="$RUNNER_TEMP/host-homes/codex/xdg-config" XDG_DATA_HOME="$RUNNER_TEMP/host-homes/codex/xdg-data" XDG_STATE_HOME="$RUNNER_TEMP/host-homes/codex/xdg-state" XDG_CACHE_HOME="$RUNNER_TEMP/host-homes/codex/xdg-cache" CODEX_HOME="$RUNNER_TEMP/host-homes/codex/codex-home" CLAUDE_CONFIG_DIR="$RUNNER_TEMP/host-homes/codex/claude-config" bash "$RUNNER_TEMP/release-artifacts/install-plugin.sh" --target=codex --tarball="$TARBALL" --force
          python -m venv "$RUNNER_TEMP/host-homes/omp/venv"
          "$RUNNER_TEMP/host-homes/omp/venv/bin/pip" install --no-deps --no-index "$WHEEL"
          OMP_INSTALLED_ROOT="$("$RUNNER_TEMP/host-homes/omp/venv/bin/python" -I -c 'import pathlib, z_harness_cli; print(pathlib.Path(z_harness_cli.__file__).parents[1])')"
          "$RUNNER_TEMP/host-homes/omp/venv/bin/python" -I scripts/omp-prod-export-smoke.py \
            --cli "$RUNNER_TEMP/host-homes/omp/venv/bin/z-harness" \
            --root "$OMP_INSTALLED_ROOT" --out "$RUNNER_TEMP/host-homes/omp/export"
          XDG_DATA_HOME="$RUNNER_TEMP/host-homes/cli/xdg-data" \
            XDG_BIN_HOME="$RUNNER_TEMP/host-homes/cli/bin" uv tool install --force "$WHEEL"
          python - "$RUNNER_TEMP/host-homes/cli/xdg-data/uv/tools/z-harness" <<'PY'
          from pathlib import Path
          import re, sys
          metadata = next(Path(sys.argv[1]).glob("lib/python*/site-packages/z_harness-*.dist-info/METADATA"))
          body = metadata.read_text()
          metadata.write_text(re.sub(r"(?m)^Version: .+$", "Version: 0.0.1", body))
          PY
          cp "$WHEEL" "$RUNNER_TEMP/host-homes/cli/$(basename "$WHEEL")"
          python - "$RUNNER_TEMP/release-artifacts/latest.json" "$RUNNER_TEMP/host-homes/cli/local-latest.json" "$WHEEL" <<'PY'
          import json, sys
          from pathlib import Path
          source = json.load(open(sys.argv[1]))
          source["wheel_url"] = Path(sys.argv[3]).resolve().as_uri()
          json.dump(source, open(sys.argv[2], "w"))
          PY
      - name: Require protected host runtimes and credentials
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.Z_HARNESS_RELEASE_ANTHROPIC_API_KEY }}
          CODEX_OPENAI_API_KEY: ${{ secrets.Z_HARNESS_RELEASE_CODEX_OPENAI_API_KEY }}
          OMP_OPENAI_API_KEY: ${{ secrets.Z_HARNESS_RELEASE_OMP_OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          command -v claude >/dev/null
          command -v codex >/dev/null
          command -v omp >/dev/null
          [[ -n "$ANTHROPIC_API_KEY" && -n "$CODEX_OPENAI_API_KEY" && -n "$OMP_OPENAI_API_KEY" ]]
      - name: Execute Claude clean-plugin claim and capture derived result
        env:
          CANDIDATE_SHA: ${{ needs.bind-authority.outputs.candidate_sha }}
          CANDIDATE_VERSION: ${{ inputs.candidate_version }}
          PRODUCER_REPOSITORY: ${{ github.repository }}
          PRODUCER_RUN_ID: ${{ github.run_id }}
          PRODUCER_EVENT: ${{ github.event_name }}
          ANTHROPIC_API_KEY: ${{ secrets.Z_HARNESS_RELEASE_ANTHROPIC_API_KEY }}
        run: |
          python scripts/capture-release-host-evidence.py \
            --candidate-sha "$CANDIDATE_SHA" --artifacts "$RUNNER_TEMP/release-artifacts" \
            --host claude --isolated-home "$RUNNER_TEMP/host-homes/claude" \
            --payload-path "$RUNNER_TEMP/host-homes/claude/.claude/plugins/z-harness@zeke-tools" \
            --destination "$RUNNER_TEMP/release-host-evidence/claude.json" \
            --producer-repository "$PRODUCER_REPOSITORY" \
            --producer-workflow .github/workflows/release-evidence.yml \
            --producer-run-id "$PRODUCER_RUN_ID" --producer-job produce \
            --producer-environment release-evidence --producer-event "$PRODUCER_EVENT" \
            --producer-head-sha "$CANDIDATE_SHA" --execute-command \
            claude --plugin-dir "$RUNNER_TEMP/host-homes/claude/.claude/plugins/z-harness@zeke-tools" --print "/z-fix release-evidence-dispatch-probe $CANDIDATE_SHA"
      - name: Execute CLI lifecycle claim and capture derived result
        env:
          CANDIDATE_SHA: ${{ needs.bind-authority.outputs.candidate_sha }}
          CANDIDATE_VERSION: ${{ inputs.candidate_version }}
          PRODUCER_REPOSITORY: ${{ github.repository }}
          PRODUCER_RUN_ID: ${{ github.run_id }}
          PRODUCER_EVENT: ${{ github.event_name }}
        run: |
          Z_HARNESS_RELEASE_OUTPUT="$RUNNER_TEMP/release-artifacts" \
          python scripts/capture-release-host-evidence.py \
            --candidate-sha "$CANDIDATE_SHA" --artifacts "$RUNNER_TEMP/release-artifacts" \
            --host cli --isolated-home "$RUNNER_TEMP/host-homes/cli" \
            --cli-executable "$RUNNER_TEMP/host-homes/cli/bin/z-harness" \
            --destination "$RUNNER_TEMP/release-host-evidence/cli.json" \
            --producer-repository "$PRODUCER_REPOSITORY" \
            --producer-workflow .github/workflows/release-evidence.yml \
            --producer-run-id "$PRODUCER_RUN_ID" --producer-job produce \
            --producer-environment release-evidence --producer-event "$PRODUCER_EVENT" \
            --producer-head-sha "$CANDIDATE_SHA" --execute-command \
            bash -c 'set -euo pipefail; Z_HARNESS_RELEASE_OUTPUT="$RUNNER_TEMP/release-artifacts" bash scripts/release-dry-run.sh "$CANDIDATE_VERSION"; "$RUNNER_TEMP/host-homes/cli/xdg-data/uv/tools/z-harness/bin/python" -I -c '\''from pathlib import Path; from z_harness_cli import release; from z_harness_cli.commands import update; manifest = release.parse_manifest(Path("'"$RUNNER_TEMP"'/host-homes/cli/local-latest.json").read_text(), allow_file_urls=True); update.fetch_manifest = lambda: manifest; update.run(None)'\'''
      - name: Execute Codex clean-plugin claim and capture derived result
        env:
          CANDIDATE_SHA: ${{ needs.bind-authority.outputs.candidate_sha }}
          CANDIDATE_VERSION: ${{ inputs.candidate_version }}
          PRODUCER_REPOSITORY: ${{ github.repository }}
          PRODUCER_RUN_ID: ${{ github.run_id }}
          PRODUCER_EVENT: ${{ github.event_name }}
          OPENAI_API_KEY: ${{ secrets.Z_HARNESS_RELEASE_CODEX_OPENAI_API_KEY }}
        run: |
          python scripts/capture-release-host-evidence.py \
            --candidate-sha "$CANDIDATE_SHA" --artifacts "$RUNNER_TEMP/release-artifacts" \
            --host codex --isolated-home "$RUNNER_TEMP/host-homes/codex" \
            --payload-path "$RUNNER_TEMP/host-homes/codex/plugins/z-harness" \
            --destination "$RUNNER_TEMP/release-host-evidence/codex.json" \
            --producer-repository "$PRODUCER_REPOSITORY" \
            --producer-workflow .github/workflows/release-evidence.yml \
            --producer-run-id "$PRODUCER_RUN_ID" --producer-job produce \
            --producer-environment release-evidence --producer-event "$PRODUCER_EVENT" \
            --producer-head-sha "$CANDIDATE_SHA" --execute-command \
            codex exec "/z-fix release-evidence-dispatch-probe $CANDIDATE_SHA"
      - name: Execute OMP installed-wheel claim and capture derived result
        env:
          CANDIDATE_SHA: ${{ needs.bind-authority.outputs.candidate_sha }}
          CANDIDATE_VERSION: ${{ inputs.candidate_version }}
          PRODUCER_REPOSITORY: ${{ github.repository }}
          PRODUCER_RUN_ID: ${{ github.run_id }}
          PRODUCER_EVENT: ${{ github.event_name }}
          OPENAI_API_KEY: ${{ secrets.Z_HARNESS_RELEASE_OMP_OPENAI_API_KEY }}
        run: |
          python scripts/capture-release-host-evidence.py \
            --candidate-sha "$CANDIDATE_SHA" --artifacts "$RUNNER_TEMP/release-artifacts" \
            --host omp --isolated-home "$RUNNER_TEMP/host-homes/omp" \
            --omp-plugin-root "$RUNNER_TEMP/host-homes/omp/export/.omp/z-harness" \
            --destination "$RUNNER_TEMP/release-host-evidence/omp.json" \
            --producer-repository "$PRODUCER_REPOSITORY" \
            --producer-workflow .github/workflows/release-evidence.yml \
            --producer-run-id "$PRODUCER_RUN_ID" --producer-job produce \
            --producer-environment release-evidence --producer-event "$PRODUCER_EVENT" \
            --producer-head-sha "$CANDIDATE_SHA" --execute-command \
            bash -c 'set -euo pipefail; import_path="$("$RUNNER_TEMP/host-homes/omp/venv/bin/python" -I -c "import z_harness_cli; print(z_harness_cli.__file__)")"; printf "IMPORT_PATH=%s\\n" "$import_path"; omp -p --no-session --model openai/gpt-5.2 "/z-fix release-evidence-dispatch-probe $CANDIDATE_SHA"'
      - name: Validate complete trusted evidence set
        env:
          CANDIDATE_SHA: ${{ needs.bind-authority.outputs.candidate_sha }}
        run: |
          python tests/conformance/run_strict.py \
            --candidate-sha "$CANDIDATE_SHA" \
            --evidence-root "$RUNNER_TEMP/release-host-evidence"
      - name: Upload canonical candidate root
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-candidate-root
          path: ${{ runner.temp }}/release-candidate-root
          if-no-files-found: error
          retention-days: 30
      - name: Upload exact seven-file artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-artifacts
          path: ${{ runner.temp }}/release-artifacts
          if-no-files-found: error
          retention-days: 30
      - name: Upload trusted release-host evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-host-evidence
          path: ${{ runner.temp }}/release-host-evidence
          if-no-files-found: error
          retention-days: 30
