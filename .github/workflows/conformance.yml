name: Exact release-candidate conformance

on:
  workflow_dispatch:
    inputs:
      candidate_version:
        description: Canonical release version
        required: true
        type: string
      candidate_sha:
        description: Exact reviewed 40-hex prod candidate
        required: true
        type: string
      evidence_run_id:
        description: Immutable run containing candidate, artifact, and live host evidence
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  exact-candidate-verification:
    name: exact candidate / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            architecture: x64
            uv_checksum: c0f3236f146e55472663cfbcc9be3042a9f1092275bbe3fe2a56a6cbfd3da5ce
          - os: macos-14
            architecture: arm64
            uv_checksum: 2bc3d0c7bf2bd08325b1e170abac6f7e5b3346e1d4eab3370d17cefec934996f
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout the explicit candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0

      - name: Set up locked Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          architecture: ${{ matrix.architecture }}

      - name: Set up pinned uv
        uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v6.0.1
        with:
          version: "0.11.3"
          checksum: ${{ matrix.uv_checksum }}
          enable-cache: false

      - name: Install reviewed lock
        run: uv sync --frozen --all-extras --all-groups --no-install-project

      - name: Authenticate release evidence producer
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_RUN_ID: ${{ inputs.evidence_run_id }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_SHA: ${{ inputs.candidate_sha }}
        run: |
          python - <<'PY'
          import base64, json, os, re, urllib.request, yaml
          api = os.environ["GITHUB_API_URL"]
          repo = os.environ["EXPECTED_REPOSITORY"]
          run_id = os.environ["EVIDENCE_RUN_ID"]
          if not run_id.isdigit(): raise SystemExit("evidence_run_id must be numeric")
          def get(path):
              request = urllib.request.Request(
                  f"{api}/repos/{repo}/{path}",
                  headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}", "Accept": "application/vnd.github+json"},
              )
              with urllib.request.urlopen(request) as response: return json.load(response)
          run = get(f"actions/runs/{run_id}")
          workflow_meta = get(f"actions/workflows/{run['workflow_id']}")
          expected = (repo, ".github/workflows/release-evidence.yml", "workflow_dispatch", os.environ["EXPECTED_SHA"], "success")
          actual = (run["repository"]["full_name"], workflow_meta["path"], run["event"], run["head_sha"], run["conclusion"])
          if actual != expected: raise SystemExit(f"untrusted evidence run metadata: {actual!r}")
          artifacts = get(f"actions/runs/{run_id}/artifacts?per_page=100")["artifacts"]
          expected_names = {"release-candidate-root", "release-artifacts", "release-host-evidence"}
          if {item["name"] for item in artifacts} != expected_names or any(item["expired"] for item in artifacts):
              raise SystemExit("evidence run does not contain the exact non-expired artifact set")
          if any(not re.fullmatch(r"sha256:[0-9a-f]{64}", item.get("digest", "")) for item in artifacts):
              raise SystemExit("evidence artifact digest is missing or malformed")
          jobs = get(f"actions/runs/{run_id}/jobs?per_page=100")["jobs"]
          protected_jobs = [job for job in jobs if job["name"] == "execute protected C1 host evidence"]
          if len(protected_jobs) != 1:
              raise SystemExit("selected run does not have exactly one protected evidence job")
          job = protected_jobs[0]
          job_expected = (int(run_id), run["head_sha"], "success")
          job_actual = (job["run_id"], job["head_sha"], job["conclusion"])
          if job_actual != job_expected:
              raise SystemExit(f"protected evidence job is not bound to selected run: {job_actual!r}")
          source = get(f"contents/.github/workflows/release-evidence.yml?ref={run['head_sha']}")
          workflow = base64.b64decode(source["content"]).decode()
          produce = yaml.safe_load(workflow).get("jobs", {}).get("produce", {})
          if produce.get("name") != "execute protected C1 host evidence" or produce.get("environment") != "release-evidence":
              raise SystemExit("jobs.produce is not structurally bound to the protected environment")
          uploads = [(step.get("with", {}).get("name"), step.get("uses", "")) for step in produce.get("steps", []) if str(step.get("uses", "")).startswith("actions/upload-artifact@")]
          if len(uploads) != 3 or {name for name, _ in uploads} != expected_names or any(not re.fullmatch(r"actions/upload-artifact@[0-9a-f]{40}", action) for _, action in uploads):
              raise SystemExit("selected protected job is not the exact pinned artifact producer")
          PY

      - name: Download canonical candidate root
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-candidate-root
          path: ${{ runner.temp }}/release-candidate-root
          run-id: ${{ inputs.evidence_run_id }}
          github-token: ${{ github.token }}

      - name: Download exact seven-file artifact set
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-artifacts
          path: ${{ runner.temp }}/release-artifacts
          run-id: ${{ inputs.evidence_run_id }}
          github-token: ${{ github.token }}

      - name: Download genuine C1 claimed-host evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-host-evidence
          path: ${{ runner.temp }}/release-host-evidence
          run-id: ${{ inputs.evidence_run_id }}
          github-token: ${{ github.token }}

      - name: Run the shared fail-fast then slow verifier
        env:
          Z_HARNESS_RELEASE_CANDIDATE: ${{ inputs.candidate_version }}
          Z_HARNESS_RELEASE_SHA: ${{ inputs.candidate_sha }}
          Z_HARNESS_RELEASE_REPO_ROOT: ${{ github.workspace }}
          Z_HARNESS_RELEASE_CANDIDATE_ROOT: ${{ runner.temp }}/release-candidate-root
          Z_HARNESS_RELEASE_ARTIFACTS: ${{ runner.temp }}/release-artifacts
          Z_HARNESS_RELEASE_HOST_EVIDENCE: ${{ runner.temp }}/release-host-evidence
          Z_HARNESS_EVIDENCE_REPOSITORY: ${{ github.repository }}
          Z_HARNESS_EVIDENCE_WORKFLOW: .github/workflows/release-evidence.yml
          Z_HARNESS_EVIDENCE_RUN_ID: ${{ inputs.evidence_run_id }}
          Z_HARNESS_EVIDENCE_JOB: produce
          Z_HARNESS_EVIDENCE_ENVIRONMENT: release-evidence
          Z_HARNESS_EVIDENCE_EVENT: workflow_dispatch
          Z_HARNESS_EVIDENCE_HEAD_SHA: ${{ inputs.candidate_sha }}
          Z_HARNESS_RELEASE_EVIDENCE_OUT: ${{ runner.temp }}/candidate-evidence-${{ runner.os }}.json
        run: uv run --frozen --no-sync make release-verify

      - name: Retain exact-candidate evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: candidate-evidence-${{ runner.os }}
          path: ${{ runner.temp }}/candidate-evidence-${{ runner.os }}.json
          if-no-files-found: error
          retention-days: 30
