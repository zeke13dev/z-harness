name: Conformance

on:
  pull_request:
    paths:
      - "tests/conformance/**"
      - "runtime/**"
      - "drivers/**"
  workflow_dispatch:

jobs:
  conformance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pytest

      - name: Run conformance suite
        run: pytest tests/conformance/ --junitxml=conformance-report.xml

      - name: Upload conformance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-report
          path: conformance-report.xml

      - name: Advisory fixture-bump check
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --name-only origin/main... | grep -q "tests/conformance/fixtures"; then
            PR_BODY="$(gh pr view "${{ github.event.pull_request.number }}" --json body --jq '.body')"
            if ! echo "$PR_BODY" | grep -q "CONFORMANCE-BUMP:"; then
              echo "::warning::Fixture files were modified but the PR description does not contain a 'CONFORMANCE-BUMP: <reason>' line. Please add one to explain why golden fixtures changed."
            fi
          fi
