name: Tests

# Primary regression gate for the z-harness test suites (Python + shell).
#
# Before this workflow existed, CI ran ONLY tests/conformance/ (see
# conformance.yml) plus the AskUser lint — leaving the ~1800-test main Python
# suite (tests/ + scripts/ + runtime/) and all the bash assertion harnesses
# (scripts/*test*.sh) completely ungated. A repo-wide change such as the
# external-artifact-base flip could break dozens of tests and still merge green.
# The `pytest` and `shell` jobs below close that gap.

on:
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"
      - "runtime/**"
      - "Makefile"
      - ".github/workflows/tests.yml"
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # 3.11+ is required: scripts/config.py imports the stdlib tomllib.
          python-version: "3.11"

      - name: Install dependencies
        # pytest is the runner; tomlkit is an optional dep config.py uses for
        # comment-preserving TOML writes — install it so CI exercises the same
        # path as local dev rather than the ImportError fallback.
        run: pip install pytest tomlkit jsonschema pyyaml

      - name: Configure git identity
        # Many tests git-init throwaway repos and commit; a global identity must
        # exist or those subprocess commits fail on a bare CI runner.
        run: |
          git config --global user.email "ci@z-harness.test"
          git config --global user.name "z-harness CI"

      - name: Run Python test suite (tests/ + scripts/ + runtime/)
        run: python3 -m pytest tests/ scripts/ runtime/ --junitxml=pytest-report.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: pytest-report.xml

  shell:
    # Standalone bash assertion harnesses (scripts/*test*.sh + the two
    # --self-test scripts). Previously ungated; `make test-sh` runs them all.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # The shell tests shell out to Python helpers (config.py needs tomllib).
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pytest tomlkit jsonschema pyyaml

      - name: Configure git identity
        # The shell tests git-init throwaway repos and commit.
        run: |
          git config --global user.email "ci@z-harness.test"
          git config --global user.name "z-harness CI"

      - name: Run shell test suite
        run: make test-sh
