name: Tests

# Primary regression gate for the z-harness test suites (Python + shell).
#
# Before this workflow existed, CI ran ONLY tests/conformance/ (see
# conformance.yml) plus the AskUser lint — leaving the ~1800-test main Python
# suite (tests/ + scripts/ + runtime/) and all the bash assertion harnesses
# (scripts/*test*.sh) completely ungated. A repo-wide change such as the
# external-artifact-base flip could break dozens of tests and still merge green.
# The `pytest` and `shell` jobs below close that gap.

on:
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"
      - "runtime/**"
      - "skills/**"
      - "agents/**"
      - "z_harness_cli/**"
      - "pyproject.toml"
      - ".github/workflows/release.yml"
      - ".github/workflows/conformance.yml"
      - "Makefile"
      - ".github/workflows/tests.yml"
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # 3.11+ is required: scripts/config.py imports the stdlib tomllib.
          python-version: "3.11"

      - name: Install dependencies
        # pytest is the runner; tomlkit is an optional dep config.py uses for
        # comment-preserving TOML writes — install it so CI exercises the same
        # path as local dev rather than the ImportError fallback.
        run: pip install -e ".[dev]"

      - name: Lint frontmatter
        # Fail-fast: catch unquoted colons in agent descriptions (e.g. file:line,
        # tasks: [...]) before running the full test suite.
        run: make lint-frontmatter

      - name: Lint halt categories
        # Fail-fast: every ask_user RUNTIME-GATE in commands/ must carry a valid
        # category= token. Exit 1 = missing/invalid token (hard failure).
        run: make lint-halt

      - name: Configure git identity
        # Many tests git-init throwaway repos and commit; a global identity must
        # exist or those subprocess commits fail on a bare CI runner.
        run: |
          git config --global user.email "ci@z-harness.test"
          git config --global user.name "z-harness CI"

      - name: Run Python test suite (tests/ + scripts/ + runtime/)
        run: python3 -m pytest tests/ scripts/ runtime/ --junitxml=pytest-report.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: pytest-report.xml

  shell:
    # Standalone bash assertion harnesses (scripts/*test*.sh + the two
    # --self-test scripts). Previously ungated; `make test-sh` runs them all.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # The shell tests shell out to Python helpers (config.py needs tomllib).
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Configure git identity
        # The shell tests git-init throwaway repos and commit.
        run: |
          git config --global user.email "ci@z-harness.test"
          git config --global user.name "z-harness CI"

      - name: Run shell test suite
        run: make test-sh

  generate-exports:
    # Smoke-test the on-demand export generation for all three in-scope hosts
    # (cursor, codex, antigravity).  Runs the runtime drivers directly (offline,
    # no network required).  Asserts exit 0 + zero validation warnings + expected
    # .cursor/skills, .agent/skills, and codex skills/ structures are emitted.
    # This is a generate-to-temp smoke, NOT a committed-baseline diff.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Generate exports (make export)
        run: make export && echo OK

      - name: Assert cursor skills structure
        run: |
          skill=$(ls temp/exports/cursor/.cursor/skills/ | head -1)
          [[ -n "$skill" ]] || { echo "ERROR: no cursor skills emitted"; exit 1; }
          [[ -f "temp/exports/cursor/.cursor/skills/${skill}/SKILL.md" ]] || { echo "ERROR: cursor SKILL.md missing for ${skill}"; exit 1; }
          echo "cursor: .cursor/skills/${skill}/SKILL.md OK"

      - name: Assert antigravity skills structure
        run: |
          skill=$(ls temp/exports/antigravity/.agent/skills/ | head -1)
          [[ -n "$skill" ]] || { echo "ERROR: no antigravity skills emitted"; exit 1; }
          [[ -f "temp/exports/antigravity/.agent/skills/${skill}/SKILL.md" ]] || { echo "ERROR: agy SKILL.md missing for ${skill}"; exit 1; }
          echo "antigravity: .agent/skills/${skill}/SKILL.md OK"

      - name: Assert codex native skills structure + manifest
        run: |
          skill=$(ls temp/exports/codex/skills/ | head -1)
          [[ -n "$skill" ]] || { echo "ERROR: no codex skills emitted"; exit 1; }
          [[ -f "temp/exports/codex/skills/${skill}/SKILL.md" ]] || { echo "ERROR: codex SKILL.md missing for ${skill}"; exit 1; }
          [[ -f "temp/exports/codex/.codex-plugin/plugin.json" ]] || { echo "ERROR: codex .codex-plugin/plugin.json manifest missing"; exit 1; }
          python3 -c "import json; m=json.load(open('temp/exports/codex/.codex-plugin/plugin.json')); assert m.get('skills'), 'manifest missing skills key'"
          echo "codex: skills/${skill}/SKILL.md + .codex-plugin/plugin.json OK"

      - name: Assert no exports/ artifacts tracked by git
        run: |
          if git ls-files --error-unmatch exports/ 2>/dev/null; then
            echo "ERROR: exports/ artifacts are tracked by git — they must be .gitignored"
            exit 1
          fi
          echo "exports/ correctly gitignored"
