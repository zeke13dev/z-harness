name: AskUser Callsite Audit

on:
  pull_request:
    paths:
      - "commands/**"
      - "skills/**"
      - "scripts/**"
      - "agents/**"
      - "runtime/**"
      - ".github/workflows/lint-askuser.yml"
  push:
    branches:
      - main
  workflow_dispatch:

# NOTE: This workflow is documentation/audit tooling, NOT runtime enforcement.
# Unregistered AskUserQuestion callsites under Z_HARNESS_NO_ASK=halt still block
# until the user responds. This lint makes the gap visible; it does not close it.
# v1 ships with ~35 known unregistered sites (fail-OPEN). Exit code 1 (unregistered
# callsites) is surfaced as a warning annotation; exit codes 2+ (hard errors) fail
# the workflow.

jobs:
  lint-askuser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run AskUserQuestion callsite audit
        # Exit 1 = unregistered callsites (advisory, emit warning annotation).
        # Exit 2 = usage/argument error (hard failure).
        # Exit 3+ = internal/hard error (hard failure).
        run: |
          set +e
          OUTPUT=$(bash scripts/lint-askuser.sh --strict 2>&1)
          _EC=$?
          set -e
          echo "$OUTPUT"
          if [[ $_EC -eq 1 ]]; then
            COUNT=$(echo "$OUTPUT" | grep -c '\[UNREGISTERED\]' || true)
            echo "::warning file=scripts/lint-askuser.sh::$COUNT unregistered AskUserQuestion callsite(s) found. Known v1 limitation (fail-OPEN). Run 'make lint' locally to see details."
            exit 0
          elif [[ $_EC -ne 0 ]]; then
            echo "::error file=scripts/lint-askuser.sh::lint-askuser.sh exited with code $_EC (hard failure)."
            exit $_EC
          fi

  ci-grep-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run provider-name grep gate
        # Exit 0 = clean; exit 1 = violations (hard failure — bare provider names must not appear in new code).
        # Exit 3 = internal/hard error (hard failure).
        run: |
          set +e
          OUTPUT=$(bash scripts/ci-grep-gates.sh 2>&1)
          _EC=$?
          set -e
          echo "$OUTPUT"
          if [[ $_EC -eq 1 ]]; then
            echo "::error file=scripts/ci-grep-gates.sh::Bare provider name(s) found (codex/gemini/claude without -cli suffix). Use codex-cli, gemini-cli, or claude-cli instead."
            exit 1
          elif [[ $_EC -ne 0 ]]; then
            echo "::error file=scripts/ci-grep-gates.sh::ci-grep-gates.sh exited with code $_EC (hard failure)."
            exit $_EC
          fi
