[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "z-harness"
dynamic = ["version"]
description = "Packaging CLI for z-harness — install, export, launch, doctor, and update."
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9",
    "rich>=13",
    "mcp>=1.20",
    "fastmcp>=3.4.2",
]

[project.scripts]
z-harness = "z_harness_cli.__main__:app"
zh = "z_harness_cli.__main__:app"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "tomlkit>=0.12",
    "pyyaml>=6",
    "jsonschema>=4.26",
    "referencing>=0.36",
]

[tool.hatch.version]
source = "vcs"
# Fallback when building outside a git repo (e.g., from a source archive)
fallback-version = "0.0.0.dev0"

[tool.hatch.build.targets.wheel]
packages = ["z_harness_cli"]

[dependency-groups]
dev = [
    "anyio>=4.13.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
]
