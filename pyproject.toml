[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "z-harness"
dynamic = ["version"]
description = "Packaging CLI for z-harness — install, export, launch, doctor, and update."
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9",
    "rich>=13",
]

[project.scripts]
z-harness = "z_harness_cli.__main__:app"
zh = "z_harness_cli.__main__:app"

[tool.hatch.version]
source = "vcs"
# Fallback when building outside a git repo (e.g., from a source archive)
fallback-version = "0.0.0.dev0"

[tool.hatch.build.targets.wheel]
packages = ["z_harness_cli"]
